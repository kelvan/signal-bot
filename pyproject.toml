[project]
name = "signal-bot"
version = "0.1.0"
description = "Simple bot connecting signal to an ollama chatbot"
authors = ["Florian Schweiker <kelvan@ist-total.org>"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confz>=2.0.1",
    "signalbot>=0.10.1",
]

[tool.ruff]
exclude = [
    ".direnv",
    ".env",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pycache__",
    "venv",
    "env",
    "docs",
    "dist",
    "build",
    ".mypy_cache",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "A", "B", "N", "UP", "T", "PL", "RUF", "I"]
ignore = ["A001", "A002", "B008", "PLR0913", "PLR2004", "N805", "N812"]
per-file-ignores = {}
mccabe.max-complexity = 10

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = ["env", "venv", ".venv"]
